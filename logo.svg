  <text x="296" y="163" font-family="monospace" font-size="9" style="fill:rgb(91, 141, 217);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:9px;font-weight:400;text-anchor:start;dominant-baseline:auto">→</text>
  <text x="307" y="163" font-family="monospace" font-size="9" style="fill:rgb(88, 214, 141);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:9px;font-weight:400;text-anchor:start;dominant-baseline:auto">bastion</text>

