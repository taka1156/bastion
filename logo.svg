  <polygon points="340,75 415,118 415,202 340,245 265,202 265,118" stroke-width="2.5" style="fill:rgb(26, 31, 46);stroke:rgb(74, 111, 165);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Inner hex -->
  <polygon points="340,93 400,127 400,196 340,230 280,196 280,127" stroke-width="1.5" style="fill:rgb(13, 17, 23);stroke:rgb(42, 74, 127);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

