  <line x1="345" y1="208" x2="356" y2="208" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(91, 141, 217);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="353" y1="205" x2="353" y2="208" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(91, 141, 217);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="356" y1="205" x2="356" y2="208" stroke-width="1.5" style="fill:rgb(0, 0, 0);stroke:rgb(91, 141, 217);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ── Logo text ── -->
  <text x="345" y="284" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700" letter-spacing="2" style="fill:rgb(232, 237, 244);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:28px;font-weight:700;text-anchor:middle;dominant-baseline:auto">bastion</text>
  <text x="340" y="306" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="1" style="fill:rgb(136, 153, 187);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">portable · secure · containerized</text>

  <!-- Dev Container badge -->
  <rect x="270" y="320" width="140" height="24" rx="12" stroke-width="1" style="fill:rgb(13, 17, 23);stroke:rgb(42, 74, 127);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="340" y="336" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="0.5" style="fill:rgb(91, 141, 217);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">✦ Dev Container ready</text>
</svg>
