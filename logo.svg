  <line x1="302" y1="108" x2="378" y2="108" stroke-width="1" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(91, 141, 217);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

