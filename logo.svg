  <text x="600" y="232" text-anchor="middle" font-family="monospace" font-size="11" style="fill:rgb(136, 153, 187);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">remote</text>

